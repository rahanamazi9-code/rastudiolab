<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>About — ra. studio</title>

  <link
    rel="icon"
    type="image/png"
    href="images/favicon.png"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <a class="logo" href="index.html" aria-label="ra. studio home">
      <img src="images/logo.png" alt="ra. studio">
    </a>

    <nav aria-label="Main navigation">
      <a href="studio.html">Studio</a>
      <a href="services.html">Services</a>
      <a href="about.html" aria-current="page">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="about-page">

    <section class="about-intro">
      <p class="section-label">About</p>

      <h1>
        Our team
      </h1>
    </section>

    <section class="team-section" aria-label="Founders">

      <article class="team-member">
        <img
          class="team-image"
          src="images/raha.png"
          alt="Portrait of Raha Namazi"
        >

        <div class="team-info">
          <h2>Raha Namazi</h2>
          <p class="team-role">Co-founder</p>

          <p class="team-bio">
            Architectural engineer and interior designer,
            educated in Shiraz, Tehran and London
          </p>
        </div>
      </article>

      <article class="team-member">
        <img
          class="team-image"
          src="images/ramin.jpg"
          alt="Portrait of Ramin Kazemzadeh"
        >

        <div class="team-info">
          <h2>Ramin Kazemzadeh</h2>
          <p class="team-role">Co-founder</p>

          <p class="team-bio">
            Architectural engineer, designer, and construction supervisor educated in Shiraz
          </p>
        </div>
      </article>

    </section>

  </main>

</body>
</html>
